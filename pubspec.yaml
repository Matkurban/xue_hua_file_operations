name: xue_hua_file_operations
description: "Cross-platform Flutter plugin for picking files/directories, save-as, saving to the gallery, and opening files with the system default app."
version: 1.3.1
homepage: https://github.com/Matkurban/xue_hua_file_operations
repository: https://github.com/Matkurban/xue_hua_file_operations
topics:
  - files
  - file-picker
  - file-saver
  - document-picker
  - desktop

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.kurban.xue_hua_file_operations
        pluginClass: XueHuaFileOperationsPlugin
      ios:
        pluginClass: XueHuaFileOperationsPlugin
      linux:
        pluginClass: XueHuaFileOperationsPlugin
      macos:
        pluginClass: XueHuaFileOperationsPlugin
      windows:
        pluginClass: XueHuaFileOperationsPluginCApi
      web:
        pluginClass: XueHuaFileOperationsWeb
        fileName: xue_hua_file_operations_web.dart
